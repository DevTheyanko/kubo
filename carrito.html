</a>

<script src="assets/store.js"></script>
<script>
const WA_NUMBER = '584240000000';

function renderCart(){
  const cart = getCart();
  const ids = Object.keys(cart);
  const wrapper = document.getElementById('cartWrapper');

  if(ids.length === 0){
    wrapper.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
        <h3>Tu carrito está vacío</h3>
        <p>Explora el catálogo y encuentra algo para tu hogar.</p>
        <a class="btn btn-dark" href="catalogo.html">Ir al catálogo</a>
      </div>`;
    return;
  }

  const itemsHTML = ids.map(id => {
    const p = findProduct(id);
    if(!p) return '';
    return `
      <div class="cart-item" data-id="${p.id}">
        <div class="imgbox">${cubeIconSVG(p.id)}</div>
        <div class="info">
          <div class="brand">${p.brand} · SKU ${p.sku}</div>
          <div class="name"><a href="producto.html?id=${p.id}">${p.name}</a></div>
          <div class="price">$${formatPrice(p.price)}</div>
        </div>
        <div class="side">
          <div class="qty-box">
            <button class="dec" aria-label="Restar">−</button>
            <span>${cart[id]}</span>
            <button class="inc" aria-label="Sumar">+</button>
          </div>
          <button class="remove-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6h12z"/></svg> Eliminar</button>
        </div>
      </div>`;
  }).join('');

  const subtotal = cartTotal();
  const shipping = subtotal >= 80 ? 0 : 8;
  const total = subtotal + shipping;

  wrapper.innerHTML = `
    <div class="cart-layout">
      <div>${itemsHTML}</div>
      <div class="summary-box">
        <h3>Resumen del pedido</h3>
        <div class="summary-row"><span>Subtotal</span><span>$${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>Envío</span><span>${shipping === 0 ? 'Gratis' : '$' + formatPrice(shipping)}</span></div>
        <div class="promo-row">
          <input type="text" placeholder="Código de descuento">
          <button class="btn btn-ghost" style="border-color:#E7E5DF;color:var(--ink);padding:11px 18px;" onclick="showToast('Código no válido')">Aplicar</button>
        </div>
        <div class="summary-row total"><span>Total</span><span>$${formatPrice(total)}</span></div>
        <button class="btn btn-primary" id="checkoutBtn">Finalizar por WhatsApp</button>
        <a class="btn btn-ghost" style="border-color:#E7E5DF;color:var(--ink);width:100%;justify-content:center;margin-top:10px;" href="catalogo.html">Seguir comprando</a>
      </div>
    </div>`;

  wrapper.querySelectorAll('.inc').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.cart-item').dataset.id;
    const cart = getCart();
    setQty(id, (cart[id] || 0) + 1);
    renderCart();
  }));
  wrapper.querySelectorAll('.dec').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.cart-item').dataset.id;
    const cart = getCart();
    setQty(id, (cart[id] || 0) - 1);
    renderCart();
  }));
  wrapper.querySelectorAll('.remove-btn').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.cart-item').dataset.id;
    removeFromCart(id);
    renderCart();
  }));

  document.getElementById('checkoutBtn').addEventListener('click', () => {
    const cart = getCart();
    let msg = 'Hola, quiero hacer este pedido en KUBO:%0A%0A';
    Object.keys(cart).forEach(id => {
      const p = findProduct(id);
      if(p) msg += `• [${p.sku}] ${p.name} x${cart[id]} — $${formatPrice(p.price * cart[id])}%0A`;
    });
    msg += `%0ATotal: $${formatPrice(total)}`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`, '_blank');
  });
}

renderCart();
</script>
