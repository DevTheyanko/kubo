<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — KUBO</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-kubo.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site" style="position:static;">
  <div class="wrap hd-row" style="justify-content:center;">
    <a class="logo" href="index.html">
      <img src="assets/logo-kubo.svg" alt="KUBO" class="logo-img">
      <span>KUBO</span>
    </a>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <a class="back-home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver a la tienda
    </a>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Regístrate y disfruta envíos rápidos, cuotas y ofertas exclusivas.</p>

    <div class="social-row">
      <button class="social-btn" type="button" onclick="showToast('Función no disponible en la demo')">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.8-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.9 2.2 2.7 6.4 2.7 12s4.2 9.8 9.3 9.8c5.4 0 8.9-3.8 8.9-9.1 0-.6-.1-1.1-.2-1.5H12z"/></svg>
        Google
      </button>
      <button class="social-btn" type="button" onclick="showToast('Función no disponible en la demo')">
        <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
        Facebook
      </button>
    </div>
    <div class="auth-divider">o con tu correo</div>

    <form id="registerForm" novalidate>
      <div class="field" id="nameField">
        <label for="name">Nombre completo</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="name" placeholder="Tu nombre y apellido" required>
        </div>
        <span class="error">Ingresa tu nombre completo</span>
      </div>
      <div class="field" id="emailField">
        <label for="email">Correo electrónico</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <span class="error">Ingresa un correo válido</span>
      </div>
      <div class="field" id="phoneField">
        <label for="phone">Teléfono</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg>
          <input type="tel" id="phone" placeholder="0424 000 0000" required>
        </div>
        <span class="error">Ingresa un teléfono válido</span>
      </div>
      <div class="field" id="passField">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
          <button type="button" class="toggle-pass" data-target="password" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-bar"><span></span><span></span><span></span><span></span></div>
        <span class="error">Usa al menos 8 caracteres</span>
      </div>
      <div class="field" id="pass2Field">
        <label for="password2">Confirmar contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password2" placeholder="Repite tu contraseña" required>
        </div>
        <span class="error">Las contraseñas no coinciden</span>
      </div>
      <div class="row-between" style="margin-top:4px;">
        <label class="check-inline"><input type="checkbox" id="terms"> Acepto los <a class="link-accent" href="#" style="margin:0 4px;">términos y condiciones</a></label>
      </div>
      <button type="submit" class="btn btn-dark auth-submit">Crear cuenta</button>
    </form>

    <p class="auth-foot" style="margin-top:24px;">¿Ya tienes cuenta? <a class="link-accent" href="login.html">Inicia sesión</a></p>
  </div>
</div>

<script src="assets/store.js"></script>
<script>
document.querySelectorAll('.toggle-pass').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    input.type = input.type === 'password' ? 'text' : 'password';
  });
});

const passInput = document.getElementById('password');
const bars = document.querySelectorAll('.strength-bar span');
passInput.addEventListener('input', () => {
  const v = passInput.value;
  let score = 0;
  if(v.length >= 8) score++;
  if(/[A-Z]/.test(v)) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#E7E5DF','#E23636','#F5C518','#F5C518','#2FB86E'];
  bars.forEach((b,i) => { b.style.background = i < score ? colors[score] : '#E7E5DF'; });
});

document.getElementById('registerForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('name');
  const email = document.getElementById('email');
  const phone = document.getElementById('phone');
  const pass = document.getElementById('password');
  const pass2 = document.getElementById('password2');

  const nameOk = name.value.trim().length >= 3;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
  const phoneOk = phone.value.replace(/\D/g,'').length >= 10;
  const passOk = pass.value.length >= 8;
  const pass2Ok = pass2.value === pass.value && pass.value.length > 0;

  document.getElementById('nameField').classList.toggle('invalid', !nameOk);
  document.getElementById('emailField').classList.toggle('invalid', !emailOk);
  document.getElementById('phoneField').classList.toggle('invalid', !phoneOk);
  document.getElementById('passField').classList.toggle('invalid', !passOk);
  document.getElementById('pass2Field').classList.toggle('invalid', !pass2Ok);

  if(nameOk && emailOk && phoneOk && passOk && pass2Ok){
    showToast('Cuenta creada correctamente');
    setTimeout(() => window.location.href = 'login.html', 900);
  }
});
</script>

</body>
</html>
